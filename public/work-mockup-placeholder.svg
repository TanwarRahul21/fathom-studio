<svg viewBox="0 0 1200 750" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
  </defs>

  <!-- Browser chrome frame -->
  <rect x="0" y="0" width="1200" height="750" rx="24" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>

  <!-- Title bar -->
  <rect x="0" y="0" width="1200" height="56" rx="24" fill="#111111"/>
  <rect x="0" y="32" width="1200" height="24" fill="#111111"/>
  <circle cx="32" cy="28" r="6" fill="rgba(255,255,255,0.15)"/>
  <circle cx="54" cy="28" r="6" fill="rgba(255,255,255,0.15)"/>
  <circle cx="76" cy="28" r="6" fill="rgba(255,255,255,0.15)"/>
  <rect x="480" y="16" width="240" height="24" rx="12" fill="rgba(255,255,255,0.05)"/>

  <!-- Nav -->
  <circle cx="80" cy="130" r="22" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="1.5"/>
  <text x="80" y="137" font-family="Georgia, serif" font-style="italic" font-size="20" fill="rgba(255,255,255,0.8)" text-anchor="middle">F</text>

  <rect x="820" y="118" width="60" height="24" rx="12" fill="rgba(255,255,255,0.06)"/>
  <rect x="892" y="118" width="60" height="24" rx="12" fill="rgba(255,255,255,0.06)"/>
  <rect x="964" y="118" width="60" height="24" rx="12" fill="rgba(255,255,255,0.06)"/>
  <rect x="1036" y="112" width="100" height="36" rx="18" fill="rgba(255,255,255,0.9)"/>

  <!-- Hero headline block -->
  <rect x="600" y="280" width="480" height="34" rx="6" fill="rgba(255,255,255,0.92)" transform="skewX(-6)"/>
  <rect x="640" y="330" width="400" height="34" rx="6" fill="rgba(255,255,255,0.92)" transform="skewX(-6)"/>

  <!-- Subtext -->
  <rect x="660" y="400" width="360" height="12" rx="6" fill="rgba(255,255,255,0.3)"/>
  <rect x="660" y="422" width="280" height="12" rx="6" fill="rgba(255,255,255,0.3)"/>

  <!-- Accent CTA -->
  <rect x="660" y="464" width="150" height="42" rx="21" fill="#B8603C"/>

  <!-- Bottom capability-style cards echo -->

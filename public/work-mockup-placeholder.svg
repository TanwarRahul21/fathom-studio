  <rect x="790" y="560" width="170" height="130" rx="16" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <rect x="980" y="560" width="170" height="130" rx="16" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <circle cx="630" cy="592" r="10" fill="none" stroke="#B8603C" stroke-width="1.5"/>
  <circle cx="820" cy="592" r="10" fill="none" stroke="#B8603C" stroke-width="1.5"/>
  <circle cx="1010" cy="592" r="10" fill="none" stroke="#B8603C" stroke-width="1.5"/>
